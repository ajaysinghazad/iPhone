<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="stylesheet" href="shared.css"/>
<title>02 Login Org A</title>
<style>
.phone { display:flex; flex-direction:column; }
.bg {
  position:absolute; inset: 52px 0 0; background:
    linear-gradient(rgba(26,154,183,0.35), rgba(26,154,183,0.55)),
    url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800"><rect fill="%23d4e8f0" width="400" height="800"/><ellipse cx="200" cy="500" rx="180" ry="90" fill="%23b8d4de"/></svg>') center/cover;
}
.layer { position:relative; z-index:1; display:flex; flex-direction:column; height:100%; }
.nav-bar { background:#1A9AB7; }
.nav-bar .left, .nav-bar .right { font-size:18px; opacity:.95; }
.brand-row {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding: 14px 16px 6px;
}
.logo-box {
  background: rgba(255,255,255,0.92);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  color: #0d5f73;
  line-height: 1.3;
}
.org-switch {
  background:#1A9AB7; color:#fff; width:44px; height:44px;
  border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:11px; text-align:center; line-height:1.1;
  border:2px solid #fff;
}
.form { padding: 24px 20px; margin-top: auto; margin-bottom: 80px; }
.input { border-color:#1A9AB7; }
.btn-primary { background:#1A9AB7; margin-top: 4px; }
.forgot {
  margin-top: 28px;
  text-align:center;
  color:#fff;
  font-size:15px;
  font-weight:600;
  text-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.org-pill {
  text-align:center;
  margin-bottom:12px;
  font-size:13px;
  color:#fff;
  background: rgba(0,0,0,.2);
  display:inline-block;
  margin-left:20px;
  padding:4px 10px;
  border-radius:999px;
}
.copyright {
  position:absolute; bottom:8px; left:0; right:0; text-align:center;
  font-size:9px; color:#333; padding:0 12px; z-index:2;
}
</style>
</head>
<body>
<div class="wrap">
<div class="phone">
  <div class="bg"></div>
  <div class="layer">
    <div class="status-bar" style="background:#1A9AB7">9:41</div>
    <div class="nav-bar">
      <div class="left">☺</div>
      VHA Patient
      <div class="right">↻ &nbsp; i</div>
    </div>
    <div class="brand-row">
      <div class="logo-box">VHA DEMO<br/><span style="font-weight:400">Veterans Health</span></div>
      <div class="org-switch">Change<br/>Org</div>
    </div>
    <div class="org-pill">Organisation: VHA Demo Medical Center</div>
    <div class="form">
      <input class="input" placeholder="Username" value="1111111112"/>
      <input class="input" placeholder="Password" type="password" value=""/>
      <button class="btn-primary">LOGIN</button>
      <div class="forgot">FORGOT PASSWORD ?</div>
    </div>
  </div>
  <div class="copyright">Copyright © 2024–2026 Core Mobile, Inc.</div>
</div>
<div class="label-screen">Screen 2 — Branded login (Organisation A: VHA Demo, teal theme)</div>
</div>
</body>
</html>
